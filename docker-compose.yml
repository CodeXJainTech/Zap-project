services:

  postgres:
    image: postgres:17-alpine
    container_name: zap-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zap-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  primary-backend:
    build:
      context: ./primary-backend
      dockerfile: Dockerfile
    container_name: zap-primary-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      JWT_SECRET: dev-jwt-secret-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-32chars!!
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  hooks:
    build:
      context: ./hooks
      dockerfile: Dockerfile
    container_name: zap-hooks
    depends_on:
      primary-backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      JWT_SECRET: dev-jwt-secret-change-in-production
      PORT: 3002
    ports:
      - "3002:3002"

  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: zap-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: zap-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMAIL_USER: ""
      EMAIL_PASS: ""
      ENCRYPTION_KEY: dev-encryption-key-32chars!!
    restart: unless-stopped


  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: zap-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zap-frontend
    depends_on:
      primary-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_HOOKS_URL: http://localhost:3002
    ports:
      - "3001:3001"

volumes:
  postgres_data: